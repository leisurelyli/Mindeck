# Mindeck presentation follows the stock Web bundle. Installation identity
# and public locale parameters are supplied by the Mindeck launchers.
- id: ui-brand-official
  disabled: true
- insert:
    - id: ui-brand-mindeck
      name: '@deepseek-ai/dsh-client-ui-brand-mindeck'

# Mindeck Enterprise: the Mindeck Cloud account, company models, company skills,
# and the company file library replace the DeepSeek account, its model
# providers, its sign-in UI, and the DeepSeek web search that requires a
# DeepSeek credential. Members sign in
# through the Mindeck account dialog and use the models the company configures
# in Mindeck Cloud, so personal pi-ai routes and the Models page with personal
# API keys, its first-run dialogs, and its preview notice are left out; every
# model request goes through the metered Mindeck Cloud gateway.
- id: deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true
- id: ui-settings-models
  disabled: true
- insert:
    - id: mindeck-account
      name: '@deepseek-ai/dsh-mindeck-account'
    - id: mindeck-models
      name: '@deepseek-ai/dsh-mindeck-models'
    - id: mindeck-skills
      name: '@deepseek-ai/dsh-mindeck-skills'
    - id: mindeck-files
      name: '@deepseek-ai/dsh-mindeck-files'

# A first-use default Workspace goes to <Documents>/Mindeck, apart from the
# DeepSeek Harness folder of an official installation on the same account.
- id: workspace-controller
  config:
    documentsFolder: Mindeck

# The agent introduces itself as Mindeck, the company's work assistant, instead
# of the DeepSeek Harness identity. The identity opener stays in front of the
# persona that each agent preset contributes, which keeps its own wording. Members
# work in the desktop app rather than on the harness, so the harness checkout and
# Web GUI guidance stays out of the prompt.
- id: system-prompt
  config:
    identity: >-
      You are Mindeck, the AI work assistant that the user's company provides.
      You help with the user's work, such as writing, analysis, research,
      documents, data, and code.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.
- id: harness-dev-context
  disabled: true

# Session logs upload only with the DeepSeek API provider, which Mindeck leaves
# out, so its upload setting and prompt have no effect here.
- id: ui-settings-session-log
  disabled: true
