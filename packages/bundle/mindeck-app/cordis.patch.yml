# Mindeck presentation follows the stock Web bundle. Installation identity
# and public locale parameters are supplied by the Mindeck launchers.
- id: ui-brand-official
  disabled: true
- insert:
    - id: ui-brand-mindeck
      name: '@deepseek-ai/dsh-client-ui-brand-mindeck'

# Mindeck Enterprise: the Mindeck Cloud account, company models, company web
# search, company skills, the company file library, and the company's digital
# employees come from Mindeck Cloud.
# Members sign in through the full-screen Mindeck sign-in and use the models and
# search the company configures, metered by the Mindeck Cloud gateway. The
# DeepSeek account stays available as a second sign-in under Settings, with its
# own models and DeepSeek web search. Personal API-key routes (the official
# DeepSeek key route and pi-ai) and the Models page that edits their keys are
# left out, so a member's requests use either the company gateway or a DeepSeek
# account, never a key that bypasses both. A patch replaces a row's whole
# config, so the web row restates the local fetch provider.
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: ui-settings-models
  disabled: true
- id: web
  config:
    searchProvider: mindeck-search
    fetchProvider: http
- insert:
    - id: mindeck-account
      name: '@deepseek-ai/dsh-mindeck-account'
    - id: mindeck-models
      name: '@deepseek-ai/dsh-mindeck-models'
    - id: mindeck-skills
      name: '@deepseek-ai/dsh-mindeck-skills'
    - id: mindeck-files
      name: '@deepseek-ai/dsh-mindeck-files'
    - id: mindeck-employees
      name: '@deepseek-ai/dsh-mindeck-employees'

# A member who also signs in to a personal DeepSeek account skips DeepSeek's
# first-run introduction: its full-screen welcome, recharge, and purpose pages
# would cover Mindeck and rewrite the Developer tools preference.
- id: ui-settings-account
  config:
    step: done
    completion: skipped

# New conversations start with Mindeck's general assistant; mindeck-employees
# registers it, beside one preset per digital employee. The base sets only
# `default`, which this patch replaces.
- id: agent-preset-registry
  config:
    default: mindeck-general

# A first-use default Workspace goes to <Documents>/Mindeck, apart from the
# DeepSeek Harness folder of an official installation on the same account.
- id: workspace-controller
  config:
    documentsFolder: Mindeck

# The agent introduces itself as Mindeck, the company's work assistant, instead
# of the DeepSeek Harness identity. The identity opener stays in front of the
# persona that each agent preset contributes, which keeps its own wording. Members
# work in the desktop app rather than on the harness, so the harness checkout and
# Web GUI guidance stays out of the prompt.
- id: system-prompt
  config:
    identity: >-
      You are Mindeck, the AI work assistant that the user's company provides.
      You help with the user's work, such as writing, analysis, research,
      documents, data, and code. When no web search tool is available, say
      that the company has not turned on web search instead of guessing
      current facts.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.
- id: harness-dev-context
  disabled: true

# Session logs upload only with the DeepSeek API provider, which Mindeck leaves
# out, so its upload setting and prompt have no effect here.
- id: ui-settings-session-log
  disabled: true
